repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # mkdocs.yml uses !!python/name: tags from mkdocs-material
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20   # keep in sync with CI (ruff >=0.15 resolves to 0.15.20)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
