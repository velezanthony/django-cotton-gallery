{# @strict #}
{# @description Small status dot — a closed prop set (@strict), no pass-through attrs. #}
{# @prop tone:select['online', 'busy', 'away', 'offline'] | default:"online" | description:"Status tone" #}

<c-vars tone="online" />

<span
  class="inline-block size-2.5 rounded-full
         {% if tone == 'online' %}bg-green-500{% endif %}
         {% if tone == 'busy' %}bg-red-500{% endif %}
         {% if tone == 'away' %}bg-yellow-500{% endif %}
         {% if tone == 'offline' %}bg-gray-400{% endif %}"
  aria-hidden="true"
></span>
