[tox]
min_version = 4.0
envlist =
    py310-django{42,50,51,52}
    py311-django{42,50,51,52}
    py312-django{42,50,51,52,60}
    py313-django{51,52,60}
    lint
isolated_build = true

[testenv]
extras = test
deps =
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<7.0
commands = pytest {posargs}

[testenv:lint]
description = Static checks (no test execution)
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check src

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
